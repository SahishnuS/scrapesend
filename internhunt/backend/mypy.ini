[mypy]
python_version = 3.12
ignore_missing_imports = True

# Disable strict checks that require full type annotations on every function.
# These are style preferences, not correctness issues.
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Disable generic type parameter enforcement (e.g. dict vs dict[str, Any])
disallow_any_generics = False

# Keep checking for real type errors
check_untyped_defs = True
warn_return_any = False
warn_unused_ignores = False
